[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "droopescan"
version = "1.45.1.post1"
description = "Plugin-based CMS scanner for Drupal, SilverStripe, WordPress, Joomla, and Moodle"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Pedro Worcel", email = "pedro@worcel.com"},
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Security",
]
dependencies = [
  "beautifulsoup4==4.15.0",
  "cement==2.10.14",
  "lxml==6.1.3",
  "pystache==0.6.8",
  "requests==2.34.2",
  "retrying==1.4.2",
]

[project.optional-dependencies]
test = [
  "coverage==7.13.5",
  "mock==5.2.0",
  "responses==0.26.3",
]

[project.scripts]
droopescan = "dscan.droopescan:main"

[project.urls]
Homepage = "https://github.com/godylockz/droopescan"
Issues = "https://github.com/godylockz/droopescan/issues"
Upstream = "https://github.com/SamJoan/droopescan"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["dscan*"]

[tool.uv]
package = true
